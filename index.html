const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(P.salt),iterations:P.iter,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.iv)},k,b(P.ct));
const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close();}
const saved=localStorage.getItem('cxi_dash_pw');if(saved){open_(saved).catch(()=>localStorage.removeItem('cxi_dash_pw'));}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const pw=document.getElementById('pw').value;
try{await open_(pw);if(document.getElementById('rm')&&document.getElementById('rm').checked)localStorage.setItem('cxi_dash_pw',pw);}
catch(x){document.getElementById('err').textContent='비밀번호가 맞지 않습니다';}};
